
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ily foryou ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    background: #030003;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    color: #ffb3d9;
}

/* BACKGROUND GLOW */

.background-glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #ff168a;
    filter: blur(130px);
    opacity: 0.13;
    pointer-events: none;
    animation: glowMove 4s ease-in-out infinite alternate;
}

@keyframes glowMove {
    from {
        transform: scale(.8);
        opacity: .06;
    }

    to {
        transform: scale(1.3);
        opacity: .17;
    }
}

/* OPENING SLIDE */

.opening {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 22, 138, .12),
            transparent 60%
        ),
        #030003;

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

.opening.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.opening-card {
    width: min(100%, 370px);
    text-align: center;
    animation: openingAppear 1.2s ease both;
}

@keyframes openingAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.opening-heart {
    font-size: 65px;
    display: inline-block;
    margin-bottom: 20px;
    color: #ff5eae;

    text-shadow:
        0 0 10px #ff168a,
        0 0 30px #ff168a,
        0 0 55px rgba(255, 22, 138, .6);

    animation: heartBeat 1.5s ease-in-out infinite;
}

@keyframes heartBeat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.12);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.08);
    }
}

.opening-label {
    font-size: 10px;
    letter-spacing: 5px;
    color: #ff72ba;
    margin-bottom: 18px;
    text-transform: uppercase;
}

.opening-title {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(35px, 9vw, 48px);
    font-weight: normal;
    line-height: 1.2;
    letter-spacing: 1px;
    color: #fff0f8;

    text-shadow:
        0 0 10px rgba(255, 94, 174, .7),
        0 0 25px rgba(255, 22, 138, .3);
}

.opening-title em {
    display: block;
    color: #ff72ba;
    font-weight: normal;
}

.opening-description {
    margin: 22px auto 30px;
    max-width: 290px;
    font-size: 13px;
    line-height: 1.9;
    letter-spacing: .4px;
    color: rgba(255, 220, 239, .75);
}

/* OPEN BUTTON */

.open-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    padding: 15px 27px;

    border: 1px solid rgba(255, 140, 200, .7);
    border-radius: 50px;

    background: rgba(255, 22, 138, .12);
    color: #ffe5f2;

    font-size: 11px;
    font-weight: bold;
    letter-spacing: 2px;

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255, 22, 138, .15),
        inset 0 0 12px rgba(255, 22, 138, .05);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    transition:
        transform .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}

.open-button:hover {
    background: rgba(255, 22, 138, .24);

    box-shadow:
        0 0 20px rgba(255, 22, 138, .35),
        0 0 40px rgba(255, 22, 138, .12);

    transform: translateY(-3px);
}

.open-button:active {
    transform: scale(.95);
}

.open-button:disabled {
    opacity: .7;
    cursor: wait;
}

.button-heart {
    font-size: 17px;
}

/* OPENING DECORATIONS */

.decor {
    position: absolute;
    color: #ff72ba;
    pointer-events: none;
    opacity: .6;
    animation: decorFloat 4s ease-in-out infinite alternate;
}

.decor-one {
    top: 16%;
    left: 12%;
    font-size: 18px;
}

.decor-two {
    top: 23%;
    right: 13%;
    font-size: 13px;
    animation-delay: .7s;
}

.decor-three {
    bottom: 20%;
    left: 16%;
    font-size: 13px;
    animation-delay: 1.1s;
}

.decor-four {
    bottom: 15%;
    right: 14%;
    font-size: 20px;
    animation-delay: .4s;
}

@keyframes decorFloat {
    from {
        transform: translateY(0) rotate(0);
        opacity: .3;
    }

    to {
        transform: translateY(-12px) rotate(15deg);
        opacity: .8;
    }
}

/* MAIN CONTENT */

.love-wrapper {
    position: relative;
    z-index: 1;
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    opacity: 0;
    visibility: hidden;
    transform: scale(.94);

    transition:
        opacity 1.2s ease,
        transform 1.2s ease,
        visibility 1.2s ease;
}

.love-wrapper.show {
    opacity: 1;
    visibility: visible;
    transform: scale(1);
}

/* HEART CONTAINER */

.heart-container {
    position: relative;
    width: min(88vw, 390px);
    aspect-ratio: 1 / 1;

    /*
       Heartbeat starts after the heart is formed.
    */

    transform: scale(1);
}

.heart-container.beating {
    animation: heartbeat 2.4s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }

    15% {
        transform: scale(1.035);
    }

    30% {
        transform: scale(1);
    }

    45% {
        transform: scale(1.045);
    }

    60% {
        transform: scale(1);
    }
}

/* I LOVE YOU TEXT */

.love-word {
    position: absolute;
    transform: translate(-50%, -50%) scale(0);
    white-space: nowrap;

    color: #ffb3d9;
    font-size: clamp(7px, 2vw, 11px);
    font-weight: 600;
    letter-spacing: .1px;

    text-shadow:
        0 0 4px #ff5eae,
        0 0 8px #ff168a,
        0 0 15px #ff168a;

    opacity: 0;

    transition:
        opacity .45s ease,
        transform .45s ease;
}

.love-word.visible {
    opacity: .95;
    transform: translate(-50%, -50%) scale(1);

    animation: textGlow 2s ease-in-out infinite alternate;
}

@keyframes textGlow {
    from {
        color: #ffb3d9;

        text-shadow:
            0 0 3px #ff5eae,
            0 0 7px #ff168a;
    }

    to {
        color: #fff0f8;

        text-shadow:
            0 0 5px #ffb3d9,
            0 0 12px #ff168a,
            0 0 20px #ff168a;
    }
}

/* NAME */

.name {
    margin-top: -8px;
    position: relative;
    z-index: 2;

    color: #ffb3d9;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    letter-spacing: 2px;
    text-align: center;
    white-space: nowrap;

    opacity: 0;
    transform: translateY(12px);

    text-shadow:
        0 0 5px #ff5eae,
        0 0 10px #ff168a,
        0 0 20px #ff168a;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.name.show {
    opacity: 1;
    transform: translateY(0);

    animation: nameGlow 2s ease-in-out infinite alternate;
}

@keyframes nameGlow {
    from {
        text-shadow:
            0 0 5px #ff5eae,
            0 0 10px #ff168a;
    }

    to {
        text-shadow:
            0 0 8px #ffb3d9,
            0 0 16px #ff168a,
            0 0 25px #ff168a;
    }
}

/* FLOATING HEARTS AND SPARKLES */

.particle {
    position: fixed;
    bottom: -30px;

    color: #ff72ba;
    pointer-events: none;
    z-index: 2;

    text-shadow:
        0 0 5px #ff168a,
        0 0 10px #ff168a;

    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(.5);
        opacity: 0;
    }

    20% {
        opacity: .8;
    }

    100% {
        transform: translateY(-110vh) scale(1.2);
        opacity: 0;
    }
}

/* MOBILE RESPONSIVE */

@media (max-width: 480px) {
    .heart-container {
        width: 94vw;
    }

    .love-word {
        font-size: 7px;
    }

    .name {
        font-size: 20px;
        letter-spacing: 1.5px;
    }

    .opening-description {
        font-size: 12px;
    }

    .opening-heart {
        font-size: 58px;
    }
}

@media (max-height: 650px) {
    .opening-heart {
        font-size: 45px;
        margin-bottom: 12px;
    }

    .opening-title {
        font-size: 34px;
    }

    .opening-description {
        margin: 14px auto 20px;
    }

    .opening-label {
        margin-bottom: 12px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .background-glow,
    .opening-heart,
    .decor {
        animation-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<!-- OPENING SLIDE -->

<section class="opening" id="opening">

    <span class="decor decor-one">✦</span>
    <span class="decor decor-two">♡</span>
    <span class="decor decor-three">✧</span>
    <span class="decor decor-four">♡</span>

    <div class="opening-card">

        <div class="opening-heart">♥</div>

        <div class="opening-label">
            A LITTLE SURPRISE FOR YOU
        </div>

        <h1 class="opening-title">
            Hey, My
            <em>Favorite Person</em>
        </h1>

        <p class="opening-description">
            I made something special just for you.
            <br>
            A little reminder that you mean
            <br>
            more to me than words can say. ♡
        </p>

        <button
            class="open-button"
            id="openButton"
            type="button"
        >
            <span class="button-heart">♡</span>
            <span id="buttonText">OPEN MY HEART</span>
            <span>→</span>
        </button>

    </div>

</section>

<!-- MAIN ANIMATION -->

<main class="love-wrapper" id="loveWrapper">

    <div class="heart-container" id="heart"></div>

    <div class="name" id="name">
        YUSUF HAMDANI
    </div>

</main>

<!-- BACKGROUND MUSIC -->

<audio id="backgroundMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const heart = document.getElementById("heart");
const opening = document.getElementById("opening");
const openButton = document.getElementById("openButton");
const buttonText = document.getElementById("buttonText");
const loveWrapper = document.getElementById("loveWrapper");
const music = document.getElementById("backgroundMusic");
const nameElement = document.getElementById("name");

/* =================================
   CREATE HEART-SHAPED TEXT POSITIONS
================================= */

const totalWords = 180;
const points = [];

for (let i = 0; i < totalWords; i++) {

    const t = (i / totalWords) * Math.PI * 2;

    const x = 16 * Math.pow(Math.sin(t), 3);

    const y =
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t);

    points.push({ x, y });
}

const minX = Math.min(...points.map(p => p.x));
const maxX = Math.max(...points.map(p => p.x));
const minY = Math.min(...points.map(p => p.y));
const maxY = Math.max(...points.map(p => p.y));

/*
   Create every word in its final position,
   but keep all words invisible until the button
   is pressed.
*/

points.forEach((point, i) => {

    const word = document.createElement("span");

    word.className = "love-word";
    word.textContent = "I love you";

    const left =
        9 + ((point.x - minX) / (maxX - minX)) * 82;

    const top =
        8 + ((maxY - point.y) / (maxY - minY)) * 84;

    word.style.left = left + "%";
    word.style.top = top + "%";

    heart.appendChild(word);
});

/* =================================
   FLOATING HEARTS AND SPARKLES
================================= */

function createParticle() {

    const particle = document.createElement("span");

    particle.className = "particle";

    const symbols = ["♡", "♥", "✦", "·"];

    particle.textContent =
        symbols[Math.floor(Math.random() * symbols.length)];

    particle.style.left = Math.random() * 100 + "vw";

    particle.style.fontSize =
        (8 + Math.random() * 13) + "px";

    const duration = 4 + Math.random() * 5;

    particle.style.animationDuration = duration + "s";

    document.body.appendChild(particle);

    setTimeout(() => {
        particle.remove();
    }, duration * 1000);
}

setInterval(createParticle, 400);

/* =================================
   OPEN SURPRISE + PLAY MUSIC
================================= */

let started = false;

openButton.addEventListener("click", async () => {

    if (started) return;

    openButton.disabled = true;
    buttonText.textContent = "OPENING WITH LOVE...";

    /*
       Start music from the user's click.
       Mobile browsers generally allow playback
       after a direct user interaction.
    */

    try {
        music.volume = 0.8;
        await music.play();

    } catch (error) {

        openButton.disabled = false;
        buttonText.textContent = "TAP TO TRY AGAIN";

        console.log(
            "Music could not start. Check music.mp3:",
            error
        );

        return;
    }

    started = true;

    /* Hide the opening slide */

    opening.classList.add("hide");

    /* Reveal the heart animation area */

    loveWrapper.classList.add("show");

    /* Get all the words */

    const words = Array.from(
        heart.querySelectorAll(".love-word")
    );

    /*
       Reveal words one by one.

       35 ms between words:
       180 words take approximately 6.3 seconds.
    */

    words.forEach((word, index) => {

        setTimeout(() => {

            word.classList.add("visible");

            /*
               Start the heartbeat after the
               final words have appeared.
            */

            if (index === words.length - 1) {

                setTimeout(() => {

                    heart.classList.add("beating");
                    nameElement.classList.add("show");

                }, 650);

            }

        }, index * 35);

    });

});
</script>

</body>
</html>
